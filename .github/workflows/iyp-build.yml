name: Build IYP dist

on:
  push:
    branches: [main]
    paths:
      - 'infinite-yield-plus/src/**'
      - 'infinite-yield-plus/build.lua'
      - '.github/workflows/iyp-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    defaults:
      run:
        working-directory: infinite-yield-plus
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Build
        run: lua5.4 build.lua

      - name: Commit dist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(iyp): rebuild dist [skip ci]'
          file_pattern: 'infinite-yield-plus/dist/InfiniteYieldPlus.lua'