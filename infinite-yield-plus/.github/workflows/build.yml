name: Build dist

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.lua'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Build
        run: lua5.4 build.lua

      - name: Commit dist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: rebuild dist [skip ci]'
          file_pattern: 'dist/InfiniteYieldPlus.lua'